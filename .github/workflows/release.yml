name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set the version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq --arg v "$version" '.version = $v' custom_components/xiaomi_live_map/manifest.json > m.json
          mv m.json custom_components/xiaomi_live_map/manifest.json
      - name: Zip the integration
        run: cd custom_components/xiaomi_live_map && zip -r ../../xiaomi_live_map.zip . -x '__pycache__/*'
      - uses: softprops/action-gh-release@v2
        with:
          files: xiaomi_live_map.zip
